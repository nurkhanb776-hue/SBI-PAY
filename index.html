<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBI PAY - Sign In</title>
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<style>.brand-image{display:block;width:100%;height:auto}</style>
</head>
<body class="login-page">
<main class="login-shell">
<div class="brand-mark" aria-label="SBI PAY"><img class="brand-image" src="service-logo.png" alt="SBI PAY logo"></div>
<form class="auth-form" id="login-form">
<label class="field"><span class="field-icon user-icon"></span><input type="tel" placeholder="Phone" aria-label="Phone" required></label>
<label class="field"><span class="field-icon lock-icon"></span><input type="password" placeholder="Password" aria-label="Password" required></label>
<div class="form-row"><a href="register.html">Register</a><label class="remember"><input type="checkbox"><span></span>Remember Me</label></div>
<label class="agreement"><input type="checkbox" checked><span></span>Agree <a href="#">"User Privacy Agreement"</a></label>
<div id="login-error" role="alert" style="min-height:20px;color:#d74d4d;text-align:center"></div><button class="primary-button" type="submit">Sign In</button><a class="forgot" href="reset.html">Forget Password</a>
</form>
<small class="version">v1.0.2</small>
</main>
<script>
const apiBase=window.location.origin||'https://sbi-pay.onrender.com';
document.getElementById('login-form').addEventListener('submit',async event=>{
	event.preventDefault();
	const form=event.currentTarget;
	const submitButton=form.querySelector('button[type="submit"]');
	const phone=form.querySelector('input[type="tel"]').value.replace(/\D/g,'');
	const password=form.querySelector('input[type="password"]').value;
	const error=document.getElementById('login-error');
	if(phone.length<10){error.textContent='Enter a valid mobile number.';return}
	if(!password){error.textContent='Enter your password.';return}
	submitButton.disabled=true;submitButton.textContent='Signing in...';error.textContent='';
	try{
		const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),8000);
		const response=await fetch(`${apiBase}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password}),signal:controller.signal});
		clearTimeout(timeout);
		const data=await response.json();
		if(!response.ok)throw new Error(data.error||'Unable to sign in.');
		sbiPayAuth.clearSession();sbiPayAuth.startSession(data.user);window.location.href='dashboard.html';
	}catch(networkError){
		try{sbiPayAuth.startSession(await sbiPayAuth.localLogin(phone,password));window.location.href='dashboard.html'}
		catch(localError){error.textContent=localError.message||'Invalid phone number or password.';submitButton.disabled=false;submitButton.textContent='Sign In'}
	}
});
</script>
</body>
</html>
